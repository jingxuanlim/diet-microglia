# Conda environment matching the versions the pipeline was run with.
# Create with:  conda env create -f environment.yml   (run from the repository root)
name: diet-microglia
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==2.4.6
      - pandas==3.0.2
      - scipy==1.17.1
      - scikit-image==0.26.0
      - dask==2024.8.2
      - distributed==2024.8.2
      - xarray==2025.4.0
      - zarr==2.13.6
      - numcodecs==0.14.1
      - h5py==3.15.1
      - nd2==0.10.1
      - rechunker==0.5.4
      - psutil==5.9.0
      - tqdm==4.70.1
      - matplotlib==3.10.9
      - seaborn==0.13.2
      - ipython==8.27.0
      - SimpleITK==2.5.3
      - gspread==6.2.1
      - oauth2client==4.1.3
      # bigstream and its dependencies
      - ClusterWrap==1.0.3
      - fishspot==0.5.0
      - morphsnakes==2.0.1
      - opencv-python==4.10.0.84
      - bokeh==3.6.0
      - tifffile==2024.12.12
      - pynrrd==1.1.3
      # Jupyter
      - jupyterlab==4.6.3
      - ipykernel==6.31.0
      - ipywidgets==8.1.2
      - -e .
